server:
  port: 8080

spring:
  application:
    name: call-monitoring
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://localhost:5432/call_monitoring
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

# JWT secret for signing token (change this in real production!)
app:
  jwt:
    secret: my-super-secret-key-for-call-monitoring-app-2026
    # token valid for 24 hours (in milliseconds)
    expiration-ms: 86400000
